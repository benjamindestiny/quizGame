<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Leaderboard</title>
    <link rel="stylesheet" href="leaderboard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a2e;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            max-width: 350px;
            font-weight: 600;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <div class="leaderboard-container">
        <div class="leaderboard-content">
            <div class="leaderboard-header">
                <div class="header-icon">🏆</div>
                <h1>Leaderboard</h1>
                <p>Top scores of all time</p>
                <span id="leaderboardCount" class="leaderboard-count">0 entries</span>
            </div>

            <div id="leaderboardList" class="leaderboard-list">
                <!-- Leaderboard entries will be inserted by JavaScript -->
            </div>

            <div class="leaderboard-actions">
                <button id="backToQuizBtn" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Back to Quiz
                </button>
                <button id="clearLeaderboardBtn" class="btn-clear">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            </div>
        </div>
    </div>

    <script src="leaderboard.js"></script>
</body>
</html>
