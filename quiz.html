<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎯 Quiz Game</title>
    <link rel="stylesheet" href="quiz.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

    <div class="quiz-container">
        <!-- ===== START SCREEN ===== -->
        <div id="startScreen" class="screen active">
            <div class="start-content">
                <div class="start-icon">🧠</div>
                <h1>Better Destiny Academy</h1>
                <h2>Jss2 Class Project Quiz - Issac The G.o.a.t</h2>
                <p>Test your knowledge with 10 questions</p>
                
                <!-- Name Input -->
                <div class="name-input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="nameInput" placeholder="Enter your name..." maxlength="20" />
                </div>

                <div class="start-info">
                    <div class="info-item">
                        <i class="fas fa-clock"></i>
                        <span>30 seconds per question</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-question-circle"></i>
                        <span>10 questions to answer</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-star"></i>
                        <span>Score 80%+ to win!</span>
                    </div>
                </div>
                
                <button id="startBtn" class="btn-start">
                    <i class="fas fa-play"></i> Start Quiz
                </button>
                <button id="leaderboardBtn" class="btn-leaderboard">
                    <i class="fas fa-trophy"></i> View Leaderboard
                </button>
            </div>
        </div>

        <!-- ===== QUIZ SCREEN ===== -->
        <div id="quizScreen" class="screen">
            <!-- Header -->
            <div class="quiz-header">
                <div class="quiz-progress">
                    <span id="questionCounter">1/10</span>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                </div>
                <div class="quiz-stats">
                    <div class="stat">
                        <i class="fas fa-star"></i>
                        <span id="scoreDisplay">0</span>
                    </div>
                    <div class="stat timer">
                        <i class="fas fa-clock"></i>
                        <span id="timerDisplay">30</span>s
                    </div>
                </div>
            </div>

            <!-- Question Area -->
            <div class="question-area">
                <div class="question-number" id="questionNumber">Question 1</div>
                <h2 id="questionText" class="question-text">Loading question...</h2>
            </div>

            <!-- Options Area -->
            <div id="optionsArea" class="options-area">
                <!-- Options will be inserted by JavaScript -->
            </div>

            <!-- Feedback -->
            <div id="feedback" class="feedback"></div>

            <!-- Next Button -->
            <button id="nextBtn" class="btn-next" style="display:none;">
                Next Question <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <!-- ===== RESULT SCREEN ===== -->
        <div id="resultScreen" class="screen">
            <div class="result-content">
                <div class="result-icon" id="resultIcon">🏆</div>
                <h1 id="resultTitle">Quiz Complete!</h1>
                <div class="result-score">
                    <div class="score-circle">
                        <span id="finalScore">0</span>
                        <span class="score-label">/ 10</span>
                    </div>
                    <div class="score-details">
                        <p id="resultMessage">Great job!</p>
                        <p id="resultPercentage">0%</p>
                    </div>
                </div>
                <div class="result-stats">
                    <div class="result-stat">
                        <span class="stat-label">Correct</span>
                        <span class="stat-value" id="correctCount">0</span>
                    </div>
                    <div class="result-stat">
                        <span class="stat-label">Wrong</span>
                        <span class="stat-value" id="wrongCount">0</span>
                    </div>
                    <div class="result-stat">
                        <span class="stat-label">Time Taken</span>
                        <span class="stat-value" id="timeTaken">0s</span>
                    </div>
                </div>
                <div class="result-buttons">
                    <button id="restartBtn" class="btn-restart">
                        <i class="fas fa-undo"></i> Play Again
                    </button>
                    <button id="leaderboardBtn2" class="btn-leaderboard">
                        <i class="fas fa-trophy"></i> Leaderboard
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
